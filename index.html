<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vamos aprender Português! (tudo junto)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--ink:#2b2d42;--ok:#2ecc71;--no:#e74c3c;--card:#fff;--shadow:0 5px 0 rgba(0,0,0,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:manipulation}
#app{max-width:760px;margin:0 auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom));min-height:100vh}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:26px;margin:6px 0;line-height:1.1}
.ib{background:#fff;border-radius:50%;width:48px;height:48px;font-size:24px;box-shadow:var(--shadow);flex:none}
.warn{background:#ffe3e3;border-radius:14px;padding:10px 14px;margin:8px 0;font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.tile{position:relative;border-radius:22px;padding:14px 10px 12px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:2px;color:#222;min-height:150px}
.tile .ti{font-size:46px;line-height:1.1}
.tile b{font-size:20px;line-height:1.1}
.tile small{font-size:13px;opacity:.75;line-height:1.15}
.tile .st{font-size:16px;margin-top:auto;letter-spacing:2px}
.tile:active,.card:active,.chip:active,.big:active{transform:translateY(3px);box-shadow:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:#ddd;display:block}
.dots i.d{background:var(--ok)}.dots i.c{background:#f1c40f;transform:scale(1.35)}
.prompt{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 12px}
.pic{font-size:84px;line-height:1.1;display:inline-flex;align-items:center;justify-content:center}
.pic svg{width:1em;height:1em}
.pic.sm{font-size:56px}
.b8{font-size:.9em;font-weight:800;color:#e67e22}
.big{background:#4cc9f0;border-radius:50%;width:84px;height:84px;font-size:40px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:8px 18px;font-size:18px;font-weight:700;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;font-weight:800;gap:2px}
.card.txt{font-size:38px;min-height:96px}
.card.sm{min-height:84px;font-size:30px}
.card .pic{font-size:72px}
.no{background:#ffd6d6!important;animation:shake .4s}
.yes{background:#c9f7d8!important;animation:pop .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{50%{transform:scale(1.08)}}
.word{font-size:44px;font-weight:800;letter-spacing:1px;text-align:center;line-height:1.1}
.word .sy{display:inline-block;margin:0 3px;padding:0 6px;border-radius:10px;background:#e8f4ff}
.slots{display:flex;gap:8px;justify-content:center;margin:6px 0 14px;flex-wrap:wrap}
.slot{min-width:84px;height:68px;border-radius:16px;border:3px dashed #aab;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;background:#fff}
.slot.f{border:3px solid var(--ok);background:#e9fff1}
.chip{background:#ffd166;border-radius:18px;font-size:38px;font-weight:800;min-width:84px;height:76px;padding:0 16px;box-shadow:var(--shadow)}
.chip[disabled]{opacity:.25;box-shadow:none}
.num{background:#fff;border-radius:22px;font-size:48px;font-weight:800;height:92px;box-shadow:var(--shadow)}
.sent{font-size:30px;font-weight:800;text-align:center;line-height:1.35}
.sent span{display:inline-block;padding:0 4px;border-radius:8px}
.sent span:active{background:#cfe9ff}
.parentbar{margin-top:18px;background:#fff;border-radius:16px;padding:10px;text-align:center;font-size:14px;opacity:.95}
.parentbar .row{margin-top:6px}
.ok-b,.re-b{border-radius:14px;padding:8px 18px;font-size:20px;font-weight:800;box-shadow:var(--shadow)}
.ok-b{background:#c9f7d8}.re-b{background:#ffe0c2}
#fx{position:fixed;left:0;right:0;top:35%;text-align:center;font-size:110px;pointer-events:none;opacity:0;z-index:9}
#fx.on{animation:fx .9s}
@keyframes fx{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
.end{text-align:center;padding-top:30px}
.end .stars{font-size:64px}
.end h2{font-size:34px;margin:8px 0}
.fall{position:fixed;top:-60px;font-size:34px;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wgrid .card{min-height:130px;font-size:20px}
.wgrid .card .pic{font-size:54px}
.wgrid small{font-weight:600;opacity:.6;font-size:14px}
.pn{background:#fff;border-radius:18px;padding:14px;margin:12px 0;box-shadow:var(--shadow);font-size:16px;line-height:1.4}
.pn h3{margin:0 0 6px;font-size:19px}
.pn select,.pn input{font:inherit;width:100%;padding:8px;border-radius:10px;border:2px solid #ccd}
.tag{display:inline-block;background:#ffe9b0;border-radius:999px;padding:4px 12px;margin:3px;font-weight:700;cursor:pointer}
.pill.on{background:#ffd166}
.link{background:none;text-decoration:underline;font-size:15px;padding:6px}

.puz{display:grid;grid-template-columns:repeat(3,1fr);width:min(300px,80vw);aspect-ratio:1;margin:8px auto;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:#222}
.puz i{display:flex;align-items:center;justify-content:center;font-size:26px;font-style:normal;background:#3a86ff;border:1px solid rgba(255,255,255,.35);background-size:300% 300%}
.puz i.r{background-color:#fff;border-color:transparent}
.puz i.n{animation:pop .7s 3}
.puz.mini{width:96px;margin:0;flex:none;border-radius:10px;box-shadow:none}
.puz.mini i{font-size:11px}
.prize{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border-radius:22px;padding:12px 14px;box-shadow:var(--shadow);margin-top:10px;text-align:left;font-size:20px;font-weight:800}
.prize small{display:block;font-weight:600;opacity:.65;font-size:14px}
.pc{background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap}
</style>
</head>

const W={};RAW.split('\n').forEach(l=>{const [k,p,s,li]=l.split('|');W[k]=[p,s,+li];});
const ALLKEYS=Object.keys(W);let KEYS=ALLKEYS.slice();
function applyList(){KEYS=ALLKEYS.filter(k=>save.list==='all'||W[k][2]===+save.list)}
const sylOf=k=>W[k][1].split('-');
const FAM=[];
const DIT={peixe:'ei',pneu:'eu',caixa:'ai',flauta:'au',tesoura:'ou',boi:'oi',leite:'ei',pai:'ai',pau:'au',outono:'ou',oito:'oi',euro:'eu',teia:'ei',saia:'ai',baile:'ai',auto:'au',pausa:'au',meia:'ei',beijo:'ei',queijo:'ei',cadeira:'ei',céu:'eu',chapéu:'eu',museu:'eu',noite:'oi',ouro:'ou',cenoura:'ou',rainha:'ai',pais:'ai',autocarro:'au',astronauta:'au',bandeira:'ei',rei:'ei',azeite:'ei',troféu:'eu',véu:'eu',biscoito:'oi',dois:'oi',boia:'oi',ouvido:'ou',couve:'ou',ouriço:'ou',vassoura:'ou'};
const norm=w=>w.normalize('NFD').replace(/[̀-ͯ]/g,'');
function gap(w,d){const i=norm(w).indexOf(d);return w.slice(0,i)+'<span style="color:#e67e22">__</span>'+w.slice(i+d.length)}
const DITS=['ai','au','ei','eu','iu','oi','ou','ui'];
const CONS=['p','t','m','l','v','f'],VOW=['a','e','i','o','u'];
const ALLSYL=CONS.flatMap(c=>VOW.map(v=>c+v));
const DAYS=[['segunda-feira','Monday'],['terça-feira','Tuesday'],['quarta-feira','Wednesday'],['quinta-feira','Thursday'],['sexta-feira','Friday'],['sábado','Saturday'],['domingo','Sunday']];
const SEAS=[['primavera','Spring','🌸'],['verão','Summer','☀️'],['outono','Autumn','🍂'],['inverno','Winter','❄️']];
const SV={
tapete:'<svg viewBox="0 0 64 64"><rect x="10" y="4" width="44" height="56" rx="3" fill="#c0392b"/><rect x="16" y="10" width="32" height="44" fill="#f4d03f"/><rect x="22" y="16" width="20" height="32" fill="#2980b9"/><circle cx="32" cy="32" r="6" fill="#f4d03f"/></svg>',
apito:'<svg viewBox="0 0 64 64"><circle cx="24" cy="38" r="16" fill="#555"/><rect x="30" y="22" width="30" height="14" rx="3" fill="#777"/><circle cx="24" cy="38" r="6" fill="#ddd"/></svg>',
tatu:'<svg viewBox="0 0 64 64"><ellipse cx="30" cy="38" rx="24" ry="16" fill="#a1887f"/><path d="M14 32q16-14 32 0M10 38q20-14 40 0M12 44q18-12 36 0" fill="none" stroke="#6d4c41" stroke-width="2.5"/><circle cx="55" cy="40" r="7" fill="#bcaaa4"/><circle cx="57" cy="38" r="1.6"/><rect x="14" y="50" width="6" height="8" rx="2" fill="#8d6e63"/><rect x="38" y="50" width="6" height="8" rx="2" fill="#8d6e63"/></svg>',

};

const SENT=[

let voices=[];
const hasTTS='speechSynthesis' in window;
function loadVoices(){if(!hasTTS)return;voices=speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let seq=0;
function speak(text,rate){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(text);const v=pickVoice();u.lang=v?v.lang:'pt-PT';if(v)u.voice=v;u.rate=rate||save.rate;u.onend=res;u.onerror=res;speechSynthesis.speak(u)}catch(e){res()}})}
async function say(text,rate){if(!hasTTS)return;const my=++seq;try{speechSynthesis.cancel()}catch(e){}await sleep(60);if(my!==seq)return;await speak(text,rate)}
async function sayAll(list,rate){if(!hasTTS)return;const my=++seq;try{speechSynthesis.cancel()}catch(e){}await sleep(60);for(const t of list){if(my!==seq)return;await speak(t,rate);await sleep(160)}}
let ac;
function tone(f,d,type,when){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;const s=ac.currentTime+(when||0);g.gain.setValueAtTime(.15,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
const good=()=>{tone(660,.15,'sine',0);tone(880,.25,'sine',.12)};
const bad=()=>tone(200,.3,'triangle');
function fx(t){const e=document.getElementById('fx');e.textContent=t;e.classList.remove('on');void e.offsetWidth;e.classList.add('on')}

/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function wsample(items,n,keyf){keyf=keyf||(x=>x);const pool=items.slice(),out=[];while(out.length<n&&pool.length){const ws=pool.map(x=>1+2*(save.miss[keyf(x)]||0));let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;for(;i<pool.length;i++){r-=ws[i];if(r<=0)break}i=Math.min(i,pool.length-1);out.push(pool[i]);pool.splice(i,1)}return out}
const wpick=(n,f)=>wsample(KEYS.filter(f||(()=>true)),n);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const stars=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);
function addMiss(k){save.miss[k]=Math.min(6,(save.miss[k]||0)+1);persist()}
function decMiss(k){if(save.miss[k]){save.miss[k]=Math.max(0,save.miss[k]-.5);persist()}}

/* ---------- генераторы вопросов ---------- */
const G={
 hear:w=>({t:'hear',w,opts:shuffle([w,...shuffle(KEYS.filter(k=>k!==w&&W[k][0]!==W[w][0]&&!(FAM.includes(w)&&FAM.includes(k)))).slice(0,3)])}),
 build:w=>({t:'build',w,chips:shuffle(sylOf(w).map((s,i)=>({s,i})))}),
 count:w=>({t:'count',w}),
 say:w=>({t:'say',w}),
 dit:w=>{const d=DIT[w];return{t:'dit',w,d,opts:shuffle([d,...shuffle(DITS.filter(x=>x!==d)).slice(0,2)])}},
 syl:s=>{const c=s[0],v=s[1];const o=new Set([s]);o.add(c+shuffle(VOW.filter(x=>x!==v))[0]);o.add(shuffle(CONS.filter(x=>x!==c))[0]+v);while(o.size<4)o.add(shuffle(ALLSYL)[0]);return{t:'syl',s,opts:shuffle([...o])}},
 day:d=>({t:'day',pt:d[0],en:d[1],opts:shuffle([d[1],...shuffle(DAYS.map(x=>x[1]).filter(x=>x!==d[1])).slice(0,2)])}),
 season:s=>({t:'season',pt:s[0],en:s[1],e:s[2],opts:shuffle(SEAS.map(x=>x[0]))}),
 sent:i=>({t:'sent',i,opts:shuffle([i,...shuffle(SENT.map((_,j)=>j).filter(j=>j!==i)).slice(0,2)])}),
 saysent:i=>({t:'saysent',i})
};
function makeRound(m){
 switch(m){
  case 'hear':return wpick(8).map(G.hear);
  case 'build':return wpick(8,k=>sylOf(k).length>=2).map(G.build);
  case 'count':return wpick(8).map(G.count);
  case 'say':return wpick(8).map(G.say);
  case 'dit':return wpick(8,k=>DIT[k]).map(G.dit);
  case 'syl':return wsample(ALLSYL,8,s=>'s:'+s).map(G.syl);
  case 'days':return shuffle([...shuffle(DAYS).slice(0,4).map(G.day),...shuffle(SEAS).map(G.season)]);
  case 'sent':{const ix=SENT.map((_,i)=>i).filter(i=>save.list==='all'||SENT[i][2]===+save.list);return shuffle([...shuffle(ix).slice(0,4).map(G.sent),...shuffle(ix).slice(0,3).map(G.saysent)])}
  case 'mix':return shuffle(['hear','build','count','syl','dit','days','sent','say'].flatMap(k=>makeRound(k).slice(0,2))).slice(0,12);
 }
}

function right(){

 <p style="font-size:14px;opacity:.75">Озвучка синтетическая. Если какое-то слово или слог звучит странно, сверьте с учителем или с учебником: отдельные слоги (pe, te…) синтезатор иногда читает неидеально.</p></div>
 <div class="pn"><h3>🎯 Что даётся трудно</h3>${hard.length?hard.map(e=>`<span class="tag" data-a="wsay" data-k="${esc(spk(e[0]))}">${esc(label(e[0]))}</span>`).join(''):'Пока нет данных: ошибки появятся после нескольких раундов. Эти слова будут чаще попадаться в играх.'}</div>
 <div class="pn"><h3>💡 Как заниматься</h3>5–10 минут в день лучше, чем час раз в неделю. Слова разбиты на три набора (кнопки «Lista 1/2/3» на главном экране); «Tudo» — все вместе. Сначала «As palavras» (послушать), потом «Ouve e escolhe» и «Junta as sílabas», в конце «Diz a palavra»: ребёнок говорит вслух, вы нажимаете ✅. Перед экзаменом — «Teste final».</div>
 <div class="pn"><h3>🖼️ Картинка-приз</h3>За каждое пройденное большое задание (целый раунд из 8 вопросов в любом режиме) открывается 1 из 9 кусочков картинки. Сейчас это нарисованный футболист. Можно выбрать своё фото (например, любимого футболиста): оно берётся с этого устройства и остаётся только в браузере, обрезается до квадрата по центру.<p><input id="pfile" type="file" accept="image/*"></p><p><button class="link" data-a="defimg">Вернуть рисунок по умолчанию</button></p></div>
 <div class="pn"><button class="link" data-a="reset">${resetArmed?'Точно сбросить? Нажмите ещё раз':'Сбросить прогресс'}</button></div>`;
 const r=$('#rate');if(r)r.oninput=()=>{save.rate=+r.value;$('#rv').textContent=r.value;persist()};
 const pf=$('#pfile');if(pf)pf.onchange=()=>{const f=pf.files&&pf.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sq=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=Math.min(800,sq);c.getContext('2d').drawImage(im,(im.width-sq)/2,(im.height-sq)/2,sq,sq,0,0,c.width,c.height);customImg=c.toDataURL('image/jpeg',.82);try{localStorage.setItem('ptimg',customImg)}catch(e){}setImgStyle();parent()};im.src=fr.result};fr.readAsDataURL(f)};
 const v=$('#vsel');if(v)v.onchange=()=>{save.voice=v.value;persist()};
}

act.setlist=d=>{save.list=d.l==='all'?'all':+d.l;persist();home()};
act.prize=()=>{view='prize';app.innerHTML=`<div class="top"><button class="ib" data-a="home">🏠</button><h1 style="margin:0">O meu prémio</h1></div><div style="text-align:center">${puzzle(save.pieces,0)}<div class="pill" style="display:inline-block">🧩 ${save.pieces} / 9</div>${save.pieces>=9?'<p><button class="pill" data-a="newpic">🆕 Nova imagem</button></p>':'<p style="font-weight:700">Faz exercícios para descobrir a imagem!</p>'}${save.done?`<p>⚽ Imagens completas: ${save.done}</p>`:''}</div>`};
act.newpic=()=>{save.pieces=0;save.done=(save.done||0)+1;save.order=null;persist();ensureOrder();home()};
act.defimg=()=>{customImg='';try{localStorage.removeItem('ptimg')}catch(e){}setImgStyle();parent()};
act.parent=()=>{resetArmed=false;parent()};
act.test=()=>say('O urso come mel');
act.reset=()=>{if(!resetArmed){resetArmed=true;return parent()}save={stars:{},miss:{},pieces:0,done:0,rate:save.rate,voice:save.voice};persist();resetArmed=false;home()};

home();
</script>
</body>
</html>
